<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שמחתי לפגוש בכן! · מטקסט לשיעור</title>
<meta name="description" content="קישורים לסקיל, למצגת המלווה ולהנחיות לשימוש בסקיל.">
<meta property="og:title" content="שמחתי לפגוש בכן! · מטקסט לשיעור">
<meta property="og:description" content="הסקיל, המצגת המלווה וההנחיות – הכול במקום אחד.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<style>
:root{--navy:#12306B;--red:#D7372B;--ink:#1B1B2B;--ink2:#4C5566;--paper:#F4F1EA}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);font-family:Heebo,Arial,sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:clamp(12px,4vw,40px)}
.card{position:relative;width:100%;max-width:640px;background:#fff;border-radius:24px;border:3px dashed var(--navy);outline:10px solid #fff;margin:10px;padding:clamp(28px,7vw,56px) clamp(20px,6vw,52px) 28px;overflow:hidden}
.spool{position:absolute;top:18px;left:-40px;width:clamp(150px,36vw,230px);height:auto;pointer-events:none}
.team{font-size:clamp(14px,3.4vw,17px);color:var(--ink2);margin:0 0 12px}
.chip{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:7px 18px;font-size:clamp(15px,3.6vw,18px);font-weight:700}
h1{margin:22px 0 0;font-size:clamp(46px,12vw,76px);line-height:1.02;font-weight:900;color:var(--navy);letter-spacing:-.5px;position:relative}
.lead{margin:20px 0 0;font-size:clamp(18px,4.4vw,23px);line-height:1.5;color:#3A4256}
.lead b{color:var(--navy)}
.links{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.link{display:flex;align-items:center;gap:16px;min-height:76px;padding:14px 18px;border:3px solid var(--navy);border-radius:18px;background:#fff;color:var(--navy);text-decoration:none;transition:background .15s,transform .15s,box-shadow .15s}
.link:hover{background:#EEF2FA;transform:translateY(-2px);box-shadow:0 6px 0 rgba(18,48,107,.12)}
.link:active{transform:translateY(0);box-shadow:none}
.link:focus-visible{outline:4px solid var(--red);outline-offset:3px}
.ic{width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.ic.red{background:var(--red)}
.ic svg{width:28px;height:28px}
.txt{flex:1;min-width:0}
.t{display:block;font-size:clamp(19px,4.8vw,24px);font-weight:800;line-height:1.2}
.s{display:block;font-size:clamp(14px,3.4vw,16px);color:var(--ink2);margin-top:2px}
.go{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:#EEF2FA;display:grid;place-items:center;color:var(--navy)}
.go svg{width:22px;height:22px}
footer{margin-top:30px;padding-top:16px;border-top:2px dashed #9AA3B5;font-size:clamp(13px,3.2vw,15px);color:var(--ink2)}
@media (max-width:440px){.go{display:none}.ic{width:48px;height:48px}.ic svg{width:24px;height:24px}.link{gap:12px;padding:12px 14px}body{padding:8px}.card{margin:8px}}
@media (prefers-reduced-motion:reduce){.link{transition:none}.link:hover{transform:none}}
</style>
</head>
<body>
<main class="card">
<img class="spool" src="spool.png" alt="">
<p class="team">צוות מוביל אוריינות בחנ״מ</p>
<span class="chip">מטקסט לשיעור</span>
<h1>שמחתי<br>לפגוש בכן!</h1>
<p class="lead">הבינה עושה את 80% מהעבודה, <b>התפירה העילית נשארת שלכן.</b><br>כל מה שצריך כדי להמשיך מחכה כאן:</p>

<ul class="links">
<li><a class="link" href="https://garbym-create.github.io/mitext-leshiur/skill/" target="_blank" rel="noopener">
<span class="ic"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span>
<span class="txt"><span class="t">הסקיל</span><span class="s">התקנה בג׳מיני, פחות מדקה</span></span>
<span class="go"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>
</a></li>
<li><a class="link" href="https://canva.link/ubq3ykltwqfg948" target="_blank" rel="noopener">
<span class="ic red"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4"/><path d="M8 20h8"/></svg></span>
<span class="txt"><span class="t">המצגת המלווה</span><span class="s">המצגת מהמפגש בקנבה</span></span>
<span class="go"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>
</a></li>
<li><a class="link" href="https://garbym-create.github.io/mitext-leshiur/site/#pnl-near" target="_blank" rel="noopener">
<span class="ic"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6l1 1 2-2"/><path d="M4 12l1 1 2-2"/><path d="M4 18l1 1 2-2"/></svg></span>
<span class="txt"><span class="t">הנחיות לשימוש בסקיל</span><span class="s">אתר המסלולים</span></span>
<span class="go"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>
</a></li>
</ul>

<footer>ממעבדת הניסויים של מרי גרבי</footer>
</main>
</body>
</html>
