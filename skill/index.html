<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מתרגשת לפגוש בכן מחר! · SKILL מטקסט לשיעור</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#12306B;--navy2:#0E2552;--gold:#F2B705;--red:#D7372B;--cream:#FFF6E6;--ink:#1B1B2B;--ink2:#4C5566;--line:#E3DCCB}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Heebo",Arial,sans-serif;background:var(--cream);color:var(--ink);min-height:100svh;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;text-align:center;padding:26px 16px 30px}
header h1{margin:0;font-size:clamp(30px,5vw,46px);font-weight:800;line-height:1.15}
header p{margin:10px auto 18px;max-width:640px;font-size:clamp(17px,2.3vw,21px);line-height:1.5;color:#E6EBF5}
.cta{display:inline-flex;align-items:center;gap:12px;min-height:64px;padding:12px 34px;border-radius:999px;background:var(--gold);color:var(--navy2);font-weight:800;font-size:clamp(20px,2.8vw,26px);text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.3)}
.cta:focus-visible{outline:4px solid #fff;outline-offset:4px}
.cta svg{flex:0 0 auto}
.cta-note{display:block;margin-top:10px;font-size:15px;color:#C9D3EA}
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:18px 14px 10px;display:flex;flex-direction:column;align-items:center;gap:12px}
main h2{margin:0;font-size:clamp(20px,2.8vw,26px);color:var(--navy);font-weight:800}
.laptop{width:100%;max-width:900px;padding:0 4%}
.screen{background:#1E2430;border-radius:18px 18px 6px 6px;padding:14px 14px 18px;box-shadow:0 14px 30px rgba(18,48,107,.18)}
.stage{position:relative;aspect-ratio:1280/752;background:#fff;border-radius:6px;overflow:hidden;max-height:calc(100svh - 440px);margin:0 auto}
.stage video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;background:#fff;cursor:pointer;opacity:0;transition:opacity .25s ease}.stage video.on{opacity:1;z-index:1}
.base{height:16px;margin:0 -4%;background:linear-gradient(#C9CED8,#A9B0BD);border-radius:0 0 22px 22px;position:relative}
.base::after{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:16%;height:6px;background:#9AA2B0;border-radius:0 0 8px 8px}
.again{position:absolute;inset-inline-start:10px;bottom:10px;min-height:44px;padding:8px 16px;border-radius:999px;border:0;background:rgba(18,48,107,.9);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;opacity:0;transition:opacity .2s}
.again.show{opacity:1}
.cap{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(18px,2.4vw,22px);font-weight:700;color:var(--navy);min-height:2.4em;text-align:center}
.cap b{color:var(--red)}
.cap .n{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:18px}
.ctrl{display:flex;align-items:center;gap:14px;width:100%;max-width:560px}
.ctrl button.nav{flex:1;min-height:56px;border-radius:14px;font:inherit;font-weight:800;font-size:19px;cursor:pointer;border:2px solid var(--navy);transition:transform .12s}
.ctrl button.nav:active{transform:scale(.97)}
#prev{background:#fff;color:var(--navy)}
#next{background:var(--navy);color:#fff}
.ctrl button.nav:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:9px;justify-content:center}
.dots button{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy);background:#fff;padding:0;cursor:pointer}
.dots button.on{background:var(--navy);transform:scale(1.15)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
footer{text-align:center;font-size:14px;color:var(--ink2);padding:6px 0 16px}
footer b{color:var(--navy)}
@media (max-width:600px){header{padding:20px 12px 24px}.screen{padding:8px 8px 12px;border-radius:12px 12px 4px 4px}.stage{max-height:none}.ctrl{gap:10px}}
</style>
</head>
<body>
<header>
  <h1>מתרגשת לפגוש בכן מחר!</h1>
  <p>לקראת המפגש, אנא לחצו על הקישור והתקינו את ה-SKILL:</p>
  <a class="cta" href="https://gemini.google.com/customize/skills/d/1kUjpE85MWXwQS7UbhlUKBSToSc0jIVDo?usp=sharing" target="_blank" rel="noopener">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    SKILL מטקסט לשיעור
  </a>
  <span class="cta-note">נפתח בג׳מיני בחלון חדש · עדיף במחשב · פחות מדקה</span>
</header>
<main>
  <h2>איך מתקינים? צעד אחר צעד</h2>
  <div class="laptop" aria-label="הדגמה על מסך מחשב">
    <div class="screen"><div class="stage"><video class="vv on" muted playsinline preload="auto" poster="media/poster.jpg"></video><video class="vv" muted playsinline preload="auto"></video></div></div>
    <div class="base" aria-hidden="true"></div>
  </div>
  <div class="cap" id="cap" aria-live="polite"></div>
  <div class="dots" id="dots" aria-label="צעדים"></div>
  <div class="ctrl"><button type="button" class="nav" id="prev">→ הקודם</button><button type="button" class="nav" id="next">הבא ←</button></div>
</main>
<footer><b>נתראה מחר!</b> · ממעבדת הניסויים של מרי גרבי</footer>
<script>
(function(){
  var S=["לוחצות על הכפתור <b>SKILL מטקסט לשיעור</b>, ונפתח דף הסקיל","לוחצות <b>הוספת סקיל</b>","מאשרות <b>הוספה</b>","<b>זהו! הסקיל מותקן</b> 🎉 מחר נשתמש בו"];
  var vids=[].slice.call(document.querySelectorAll('.vv')),cur=0,cap=document.getElementById('cap'),dots=document.getElementById('dots'),prev=document.getElementById('prev'),next=document.getElementById('next'),i=-1,token=0;
  function src(k){return 'media/b0'+(k+1)+'.mp4';}
  S.forEach(function(_,k){var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','צעד '+(k+1));b.onclick=function(){go(k);};dots.appendChild(b);});
  function ui(){
    cap.innerHTML='<span class="n">'+(i+1)+'</span><span>'+S[i]+'</span>';
    [].forEach.call(dots.children,function(d,j){d.classList.toggle('on',j===i);d.setAttribute('aria-current',j===i?'step':'false');});
    prev.disabled=i===0;next.textContent=i===S.length-1?'↻ מההתחלה':'הבא ←';
  }
  function ready(v,cb){ if(v.readyState>=2){cb();return;} var f=function(){v.removeEventListener('loadeddata',f);cb();}; v.addEventListener('loadeddata',f); }
  function go(k){
    k=Math.max(0,Math.min(S.length-1,k)); var t=++token;
    var a=vids[cur], b=vids[1-cur];
    if(k===i){ a.currentTime=0; var p0=a.play(); if(p0&&p0.catch)p0.catch(function(){}); return; }
    i=k; ui();
    if(b.getAttribute('src')!==src(k)){ b.setAttribute('src',src(k)); b.load(); }
    ready(b,function(){
      if(t!==token) return;
      try{b.currentTime=0;}catch(e){}
      var p=b.play(); if(p&&p.catch)p.catch(function(){});
      b.classList.add('on'); a.classList.remove('on'); cur=1-cur;
      setTimeout(function(){ if(t!==token) return; a.pause(); if(i<S.length-1){ a.setAttribute('src',src(i+1)); a.load(); } },300);
    });
  }
  vids.forEach(function(v){ v.addEventListener('click',function(){ go(i); }); });
  prev.onclick=function(){go(i-1);}; next.onclick=function(){go(i===S.length-1?0:i+1);};
  document.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('a'))return;if(e.key==='ArrowLeft')next.click();else if(e.key==='ArrowRight'&&i>0)go(i-1);});
  var x0=null,st=document.querySelector('.stage');
  st.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  st.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50){if(dx<0)next.click();else if(i>0)go(i-1);}});
  vids[0].setAttribute('src',src(0)); vids[0].load();
  i=0; ui(); ready(vids[0],function(){ var p=vids[0].play(); if(p&&p.catch)p.catch(function(){}); vids[1].setAttribute('src',src(1)); vids[1].load(); });
})();
</script>
</body>
</html>
